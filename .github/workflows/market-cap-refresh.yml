name: Basket market-cap refresh

on:
  schedule:
    - cron: "20 21 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basket-market-cap-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test enrichment contracts
        run: uv run pytest -q
      - name: Enrich daily prices with market caps
        run: uv run basket-index-tracker refresh-market-caps
